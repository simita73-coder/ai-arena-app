<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>AI-Aréna Web v1.14.0</title>
<style>
:root{--bg:#1b1d1f;--bar:#111;--panel:#262a2d;--head:#33383c;--fg:#e8efe0;--mut:#9aa5ab;--acc:#4fc3f7;--ok:#2e7d32;--err:#ef5350;--line:#3d4348;--echo:#81d4fa;--code:#15181a;--in:#202325}
:root[data-theme=light]{--bg:#eceff1;--bar:#fff;--panel:#fff;--head:#e3e8eb;--fg:#15191c;--mut:#5d6b73;--acc:#0b6bb5;--ok:#2e7d32;--err:#c62828;--line:#cfd6db;--echo:#0055cc;--code:#f1f4f6;--in:#fafafa}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--head);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:active{filter:brightness(1.15)}
button.danger{color:var(--err)}
.bar{display:block;background:var(--bar);padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px}
.brand small{color:var(--mut);font-weight:400}
.bar-btns{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar-btns::-webkit-scrollbar{display:none}
.bar-btns button{flex:1 0 46px;min-width:46px;min-height:40px;padding:0;font-size:18px}
.bar-btns button svg{display:block;margin:auto}
.navrow{display:flex;align-items:center;gap:6px;padding:0 0 2px;flex:0 0 auto}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:8px 10px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:0 0 auto;width:52px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--head);border:1px solid var(--line);border-radius:8px;font-size:22px;cursor:pointer}
img.pi{background:#fff;padding:3px;box-sizing:border-box}
.pi{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:#fff;font:700 14px/1 system-ui,sans-serif;letter-spacing:-.3px;object-fit:contain}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tier{flex:0 0 auto;border-radius:999px;font-weight:700;padding:5px 12px;font-size:13px;white-space:nowrap;color:#fff}
.tier.strong{background:#6a1b9a;border-color:#6a1b9a}
.tier.cheap{background:#00695c;border-color:#00695c}
.brow .tier{border-radius:8px;min-width:40px;min-height:40px;padding:0;font-size:18px}
.mlbl{font-size:12px;color:var(--mut);margin-bottom:-2px}
.deck{flex:1;min-height:0;display:flex;gap:8px;padding:4px 8px 8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.panel{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:900px){.panel{flex:1 0 380px;scroll-snap-align:start}}
.ic.on{background:var(--ok);border-color:var(--ok);color:#fff}
.src{font-size:12px;color:var(--mut);margin:-6px 0 12px}
.src ol{margin:2px 0 0;padding-left:20px}
.src a{color:var(--acc);overflow-wrap:anywhere}
.fback{display:none}
html.full,body.full{height:auto}
body.full{display:block;overflow:auto}
body.full .bar,body.full .navrow,body.full .composer{display:none}
body.full .deck{display:block;overflow:visible;padding:8px}
body.full .panel{display:none}
body.full .panel.fp{display:block;overflow:visible}
body.full .panel.fp .pbody{overflow:visible}
body.full .fback{display:block;margin:4px 8px 24px;width:calc(100% - 16px);padding:12px}
.phead{display:flex;align-items:center;gap:6px;background:var(--head);padding:6px 8px;flex:0 0 auto}
.pname{font-weight:700;color:var(--acc)}
.pmodel{color:var(--mut);font-size:12px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psend{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;padding:4px 4px 4px 10px;cursor:pointer}
.psend input{width:24px;height:24px;margin:0;accent-color:var(--ok);cursor:pointer}
.panel.off .pbody{opacity:.5}
.panel.soff .msg,.panel.soff .prog,.panel.soff .meta,.panel.soff .src{opacity:.5}
.chip.off{opacity:.45}
.loaded{background:var(--head);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:13px;color:var(--mut)}
.pmode{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut)}
.phead button{padding:2px 8px;font-size:14px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:12px;position:relative;-webkit-overflow-scrolling:touch}
.prog{margin:0 0 12px;font-size:14px;line-height:1.9}
.prog .mut{color:var(--mut)}
.hint{color:var(--mut);text-align:center;margin-top:20px;font-size:14px}
.msg.user{color:var(--echo);font-style:italic;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;overflow-wrap:anywhere}
.msg.user .fl{font-size:12px;color:var(--mut);font-style:normal;margin-top:4px}
.meta{color:var(--mut);font-size:11px;margin:6px 0 14px}
.err{color:var(--err);white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.wait{color:var(--mut);margin:8px 0}
.dots{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;vertical-align:-2px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.md{overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;line-height:1.25}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3,.md h4,.md h5,.md h6{font-size:1.07em}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md blockquote{margin:0 0 10px;padding:2px 10px;border-left:3px solid var(--line);color:var(--mut)}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md code{background:var(--code);border-radius:4px;padding:1px 5px;font:13px ui-monospace,Consolas,monospace}
.md .code{position:relative;margin:0 0 10px}
.md .code pre{margin:0;background:var(--code);border-radius:8px;padding:10px;overflow-x:auto}
.md .code pre code{background:none;padding:0;white-space:pre}
.md .code .cp{position:absolute;top:4px;right:4px;font-size:11px;padding:1px 7px;opacity:.85}
.md table{border-collapse:collapse;margin:0 0 10px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;min-width:92px;overflow-wrap:normal;word-break:normal;vertical-align:top}
.md a{color:var(--acc)}
.composer{flex:0 0 auto;background:var(--bar);border-top:1px solid var(--line);padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.atts{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.atts:empty{display:none}
.att{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--head);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12px;max-width:200px}
.att img{width:34px;height:34px;object-fit:cover;border-radius:4px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{padding:0 6px;border:0;background:none;font-size:16px}
.crow{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.tools{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0}
.tools::-webkit-scrollbar{display:none}
.tools>*{flex:0 0 auto}
.eff{position:relative}
.bd{position:absolute;right:2px;bottom:2px;font:700 10px/1 system-ui,sans-serif;font-style:normal;background:var(--ok);color:#fff;border-radius:6px;padding:1px 4px}
.effopt{display:block;width:100%;text-align:left;margin-bottom:6px;padding:10px 12px}
.effopt.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.effopt small{display:block;opacity:.8}
.modebtn{min-width:40px;min-height:40px;padding:0;font-size:18px;white-space:nowrap}
.modebtn.m-g{background:#1565c0;border-color:#1565c0;color:#fff}
.modebtn.m-t{background:#6a1b9a;border-color:#6a1b9a;color:#fff}
.modebtn.m-k{background:#37474f;border-color:#37474f;color:#fff}
.brow .send{flex:0 0 auto;margin-left:0;min-width:0;padding:0 9px}
.irow{display:flex;gap:6px;align-items:flex-end}
.irow .ic.on{background:var(--err);border-color:var(--err);color:#fff}
.irow .ic{flex:0 0 auto}
.crow textarea{flex:1;width:auto;min-width:0;resize:none;max-height:140px;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ic{min-width:40px;min-height:40px;font-size:18px}
.send{min-height:40px;background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700;padding:0 14px}
.send.stop{background:var(--err);border-color:var(--err)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;max-width:90vw;z-index:50;pointer-events:none}
dialog{width:min(680px,96vw);max-height:92dvh;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg)}
dialog::backdrop{background:#0008}
.dlg-in{display:flex;flex-direction:column;max-height:92dvh}
.dlg-body{overflow-y:auto;padding:14px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.dlg-body h2{margin:0 0 8px}
.dlg-body h3{margin:16px 0 6px;color:var(--acc)}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.fld input,.srow select,.sbox select{width:100%;background:var(--in);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.inl input{flex:1;min-width:0}
.srow,.sbox{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;display:grid;gap:6px}
.sline{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sline .mv{min-width:36px;min-height:36px;padding:0}
.sline .chk{flex:1}
.chk{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">⚔️ AI-Aréna <small>Web v1.14.0</small></div>
  <div class="bar-btns">
    <button id="bExp" title="Mentés szövegfájlba">⬇</button>
    <button id="bLoad" title="Mentett beszélgetés (txt) betöltése – minden bekapcsolt AI megkapja a teljes szöveget, és folytathatod a témát">📂</button>
    <button id="bClear" title="Új beszélgetés (mind)">🗑</button>
    <button id="bReset" title="Csak az aktuális ablak törlése (újraindítása)">↺</button>
    <button id="bCopy" title="Az aktuális ablak utolsó válaszának másolása">📋</button>
    <button id="bFull" title="Teljes oldalas nézet az aktuális ablakról (görgetős képernyőképhez)">⛶</button>
    <button id="bSet" title="Beállítások" aria-label="Beállítások"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
    <button id="bTheme" title="Világos / sötét">🌓</button>
  </div>
</header>
<div class="navrow"><nav id="chips" class="chips"></nav></div>
<main id="deck" class="deck"></main>
<footer class="composer">
  <div id="atts" class="atts"></div>
  <div class="crow">
    <div class="irow">
      <textarea id="inp" rows="1" placeholder="Kérdés…"></textarea>
      <button id="bMic" class="ic" type="button" title="Diktálás magyarul – koppints, beszélj, újra koppintva leáll">🎤</button>
      <button id="bSpk" class="ic" type="button" title="Az aktuális ablak utolsó válaszának felolvasása – újra koppintva leáll">🔊</button>
    </div>
    <div class="brow">
      <div class="tools">
        <button id="bAtt" class="ic" title="Kép / PDF / szövegfájl csatolása">📎</button>
        <button id="bWeb" class="ic" type="button" title="Webes keresés (a küldéskor minden AI-nál)">🌐</button>
        <button id="bMode" class="modebtn" type="button"></button>
        <button id="bTeach" class="ic" type="button">🎓</button>
        <button id="bTier" class="tier cheap" type="button"></button>
        <button id="bEff" class="ic eff" type="button"></button>
      </div>
      <button id="bSend" class="send">Küldés</button>
    </div>
  </div>
  <input id="loadFile" type="file" hidden accept=".txt,text/plain">
  <input id="file" type="file" hidden multiple accept="image/*,application/pdf,.pdf,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yml,.yaml,.ini,.log,.sql,.bat,.sh,.cfg,.toml">
</footer>
<button id="fBack" class="fback" type="button">↩ Vissza a lapozható nézethez</button>
<dialog id="effDlg" style="width:min(380px,94vw)"><div class="dlg-in"><div class="dlg-body"><h2>🎚 Claude effort</h2><p class="note">Azt szabályozza, mennyit gondolkodik és dolgozik a Claude a válaszon. Minden módban és mindkét modellszinten érvényes. Csak a Claude-ra hat. Magasabb szint: alaposabb, de lassabb és drágább válasz.</p><div id="effList"></div></div><div class="dlg-foot"><button type="button" id="effClose">Bezár</button></div></div></dialog>
<dialog id="pinDlg" style="width:min(340px,92vw)"><div class="dlg-in"><div class="dlg-body"><h2>🔒 PIN</h2><p id="pinMsg" class="note"></p><input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="width:100%;font-size:26px;letter-spacing:10px;text-align:center;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:8px"><p id="pinErr" class="note" style="color:var(--err);min-height:1.3em;margin:8px 0 0"></p></div><div class="dlg-foot"><button type="button" id="pinCancel">Mégse</button><button type="button" id="pinOk" class="send">OK</button></div></div></dialog>
<dialog id="dlg"><div class="dlg-in"><div id="dlgBody" class="dlg-body"></div><div class="dlg-foot"><button type="button" id="dCancel">Mégse</button><button type="button" id="dSave" class="send">Mentés</button></div></div></dialog>

<script>
(() => {
'use strict';

/* ============ Alapok ============ */
const LS_KEY = 'miarena.v1';
const MAX_SLOTS = 9;
const MAX_FILES = 6;
const MAX_PDF_BYTES = 10 * 1024 * 1024;
const MAX_TEXT_CHARS = 200000;
const TEXT_EXT = ['txt','md','csv','json','py','js','ts','html','css','xml','yml','yaml','ini','log','sql','bat','sh','cfg','toml'];

const MODES = {
  'Gyors': 'Segítőkész asszisztens vagy.',
  'Gondolkodó': 'Segítőkész asszisztens vagy. A választ így építsd fel: az első 2-3 mondatban tömören, közvetlenül add meg a lényeget (a kérdésre adott választ), utána következzen a részletesebb, jól tagolt kifejtés (rövid alcímek, felsorolások, példák, ahol segítenek). Ne írd le, hogyan jutottál a válaszhoz, ne meséld a gondolatmenetedet. Ha valamiben bizonytalan vagy, a végén jelezd. A kérdés nyelvén válaszolj.',
  'Kódoló': 'Szakértő programozó vagy. Csak tiszta kódot írj!'
};

/* Új szolgáltató felvételéhez: ide kerül egy új bejegyzés + egy call/list függvény */
const PROVIDERS = {
  gemini:    { label: 'Gemini', keyLabel: 'Gemini API-kulcs', strong: 'gemini-3.1-pro-preview', cheap: 'gemini-3.8-flash', sum: 'gemini-3.8-flash',
               suggest: ['gemini-3.1-pro-preview', 'gemini-4-argon', 'gemini-pro-latest', 'gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite'],
               call: callGemini, list: listGemini },
  openai:    { label: 'GPT',    keyLabel: 'OpenAI (GPT) API-kulcs', strong: 'gpt-6-astra', cheap: 'gpt-6-luna', sum: 'gpt-6-luna',
               suggest: ['gpt-6-astra', 'gpt-6.1-sol', 'gpt-6-sol', 'gpt-6-luna', 'gpt-5.5-pro', 'gpt-5.5'],
               call: callOpenAI, list: listOpenAI },
  anthropic: { label: 'Claude', keyLabel: 'Anthropic (Claude) API-kulcs', strong: 'claude-fable-5-1', cheap: 'claude-haiku-5-5', sum: 'claude-sonnet-5-5',
               suggest: ['claude-fable-5-1', 'claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'],
               call: callAnthropic, list: listAnthropic },
  meta:      { label: 'Meta',   keyLabel: 'Meta AI API-kulcs', strong: 'muse-wonder-1.0', cheap: 'muse-spark-1.3', sum: 'muse-spark-1.3',
               suggest: ['muse-wonder-1.0', 'muse-spark-1.3', 'muse-spark-1.2', 'muse-spark-1.1'],
               call: callMeta, list: listMeta },
  xai:       { label: 'Grok',   keyLabel: 'xAI (Grok) API-kulcs', strong: 'grok-4.7', cheap: 'grok-4.3', sum: 'grok-4.3',
               suggest: ['grok-4.7', 'grok-4.6', 'grok-4.5', 'grok-4.3'],
               call: callGrok, list: listGrok },
  perplexity:{ label: 'Perplexity', keyLabel: 'Perplexity API-kulcs', strong: 'sonar-pro', cheap: 'sonar', sum: 'sonar',
               suggest: ['sonar-pro', 'sonar-reasoning-pro', 'sonar', 'sonar-reasoning'],
               call: callPerplexity, list: listPerplexity }
};
const MODE_ICON = { 'Gyors': '⚡', 'Gondolkodó': '🧠', 'Kódoló': '💻' };
const MODE_CLS = { 'Gyors': 'm-g', 'Gondolkodó': 'm-t', 'Kódoló': 'm-k' };
const MODE_INFO = { 'Gyors': 'rövid, segítőkész válasz', 'Gondolkodó': 'először a lényeg, utána részletesen', 'Kódoló': 'tiszta kód' };
const SUM_SYS = 'Összefoglaló asszisztens vagy. Egy kérdést és több MI válaszát kapod. Magyarul, tömören és jól tagoltan írd meg: 1) Közös rész: miben értenek egyet. 2) Eltérések: melyik MI mit mond másképp (nevezd meg őket). 3) Ellenőrizendő: ahol a tények vagy számok eltérnek, vagy valami bizonytalan. 4) Javasolt végső válasz a kérdésre, 2-5 mondatban. Ne ismételd meg a teljes válaszokat, és ne találj ki olyan tényt, ami nincs a válaszokban.';
const MODE_HINT = { 'Gondolkodó': 'Gondolkodó (lényeg, majd részletek)' };
const EFFORTS = [
  ['auto', 'Alapértelmezett', 'a modell saját beállítása (semmit sem küld)'],
  ['low', 'Alacsony', 'gyors és olcsó'],
  ['medium', 'Közepes', 'kiegyensúlyozott'],
  ['high', 'Magas', 'alaposabb, lassabb'],
  ['xhigh', 'Nagyon magas', 'sokat gondolkodik, drága'],
  ['max', 'Maximum', 'leglassabb és legdrágább']

// <md>
function mdInline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0002' + (codes.length - 1) + '\u0002'; });
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\u0002(\d+)\u0002/g, (m, i) => '<code>' + codes[+i] + '</code>');
  return s;
}
function mdRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.trim());
}
function md(src) {
  const blocks = [];
  src = String(src || '').replace(/\r/g, '').replace(/```([\w+#.-]*)[ \t]*\n?([\s\S]*?)(```|$)/g, (m, lang, code) => {
    blocks.push(code.replace(/\n$/, ''));
    return '\n\u0001' + (blocks.length - 1) + '\u0001\n';
  });
  const lines = esc(src).split('\n');
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + mdInline(para.join('<br>')) + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push('<' + list.t + '>' + list.items.map(i => '<li>' + mdInline(i) + '</li>').join('') + '</' + list.t + '>'); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\u0001(\d+)\u0001$/))) {
      flushPara(); flushList();
      out.push('<div class="code"><button class="cp" type="button">Másol</button><pre><code>' + esc(blocks[+m[1]]) + '</code></pre></div>');
      continue;
    }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); out.push('<h' + m[1].length + '>' + mdInline(m[2]) + '</h' + m[1].length + '>'); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); continue; }
    if (line.indexOf('|') >= 0 && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      flushPara(); flushList();
      const head = mdRow(line);
      let j = i + 2; const rows = [];
      while (j < lines.length && lines[j].indexOf('|') >= 0 && lines[j].trim()) { rows.push(mdRow(lines[j])); j++; }
      out.push('<table><thead><tr>' + head.map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      i = j - 1; continue;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { flushPara(); if (!list || list.t !== 'ul') { flushList(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || list.t !== 'ol') { flushList(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); flushList(); out.push('<blockquote>' + mdInline(m[1]) + '</blockquote>'); continue; }
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  return out.join('');
}

      '</span><label class="psend" title="Kipipálva: a válaszokból összefoglaló készül. Kipipálás nélkül az összefoglalás ki van kapcsolva."><input type="checkbox" data-sum="1"' + (S.sum ? ' checked' : '') + '></label></div><div class="pbody"></div>';
    deck.appendChild(sp); paintBody('sum');
  }
  act.forEach(s => {
    const p = document.createElement('section');
    p.className = 'panel' + (skip.has(s.id) ? ' off' : ''); p.dataset.id = s.id;
    p.innerHTML = '<div class="phead"><span class="pname">' + esc(PROVIDERS[s.provider].label) + '</span><span class="pmodel">' + esc(modelOf(s)) +
      '</span><span class="pmode">' + esc(S.mode) + '</span><label class="psend" title="Kipipálva: ez az AI megkapja a következő kérdést. Kipipálás nélkül kihagyja."><input type="checkbox" data-sid="' + s.id + '"' + (skip.has(s.id) ? '' : ' checked') + '></label></div><div class="pbody"></div>';
    deck.appendChild(p);
    paintBody(s.id);
  });
  renderChips();
  if (io) io.disconnect();
  io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting && e.intersectionRatio >= 0.6) setActiveChip(e.target.dataset.id); });
  }, { root: deck, threshold: [0.6] });
  deck.querySelectorAll('.panel[data-id]').forEach(p => io.observe(p));
}

function iconHtml(p) {
  const i = PICON[p];
  if (!i) return '<span class="pi" style="background:#607d8b">' + esc(PROVIDERS[p].label.slice(0, 2)) + '</span>';
  return i.img ? '<img class="pi" alt="" src="' + esc(i.img) + '">' : '<span class="pi" style="background:' + i.c + '">' + i.t + '</span>';
}
function renderChips() {
  $('chips').innerHTML = '<div class="chip' + (S.sum ? '' : ' off') + '" data-id="sum" title="Összefoglaló · ' + esc(S.sumAI.model) + (S.sum ? '' : ' (kikapcsolva)') + '"><span class="pe">📝</span></div>' + S.slots.filter(s => s.active).map(s =>
    '<div class="chip' + (skip.has(s.id) ? ' off' : '') + '" data-id="' + s.id + '" title="' + esc(PROVIDERS[s.provider].label + ' · ' + modelOf(s)) + '">' + iconHtml(s.provider) + '</div>').join('');
  if (curId != null) setActiveChip(curId);
}
function updateTierBtn() {
  const b = $('bTier'), t = TIERS[S.tier];
  b.textContent = t.icon;
  b.className = 'tier ' + S.tier;
  b.title = t.label + ' modellek (koppints a váltáshoz: 💰 olcsó ⇄ 💪 erős)';
  b.setAttribute('aria-label', t.label + ' modellek');
}
function updateLabels() {   // váltáskor csak a feliratok frissülnek, a panelek és a válaszok maradnak
  S.slots.filter(s => s.active).forEach(s => {
    const el = deck.querySelector('.panel[data-id="' + s.id + '"] .pmodel');
    if (el) el.textContent = modelOf(s);
  });
  renderChips(); updateTierBtn();
}
function setActiveChip(id) {
  curId = String(id);
  document.querySelectorAll('#chips .chip').forEach(c => {
    const on = c.dataset.id === curId;
    c.classList.toggle('on', on);
    if (on) { try { c.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
  });
}
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const p = deck.querySelector('.panel[data-id="' + c.dataset.id + '"]');
  setActiveChip(c.dataset.id);
  if (p) p.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
});
deck.addEventListener('change', e => {
  const cb = e.target.closest('.psend input'); if (!cb) return;
  if (cb.dataset.sum !== undefined) {
    S.sum = cb.checked; saveSettings();
    const sp = cb.closest('.panel'); if (sp) sp.classList.toggle('soff', !S.sum);
    paintBody('sum'); renderChips();
    toast(S.sum ? '📝 Összefoglaló BE: ' + PROVIDERS[S.sumAI.provider].label + ' · ' + S.sumAI.model : '📝 Összefoglaló KI');
    return;
  }
  const id = +cb.dataset.sid;
  if (cb.checked) skip.delete(id); else skip.add(id);
  const p = cb.closest('.panel'); if (p) p.classList.toggle('off', !cb.checked);
  renderChips();
  const sl = S.slots.find(x => x.id === id);
  toast((cb.checked ? '✅ ' : '⏸ ') + (sl ? PROVIDERS[sl.provider].label : '') + (cb.checked ? ' újra kap kérdést' : ' kihagyva a következő kérdéseknél'));
});
deck.addEventListener('click', e => {
  const cp = e.target.closest('.cp');
  if (cp) { const pre = cp.parentElement.querySelector('pre'); if (pre) copyText(pre.textContent); return; }
});
function curPanelId() {
  if (curId != null && deck.querySelector('.panel[data-id="' + curId + '"]')) return curId;
  const p = deck.querySelector('.panel[data-id]'); return p ? p.dataset.id : null;
}
$('bCopy').addEventListener('click', () => {
  const id = curPanelId(); if (id == null) return;
  const last = [...getConvo(id).view].reverse().find(v => v.role === 'ai');
  if (last) copyText(last.text); else toast('Ebben az ablakban még nincs válasz.');
});
$('bFull').addEventListener('click', () => { const id = curPanelId(); if (id != null) setFull(id); });
$('bReset').addEventListener('click', () => {
  const id = curPanelId(); if (id == null) return;
  convo[id] = { history: [], view: [] }; paintBody(id); saveChat(); toast('Ablak újraindítva');
});

/* Teljes oldalas nézet: normál görgetésű oldal, hogy a telefon görgetős képernyőképe működjön */
function setFull(id) {
  const on = id != null;
  document.documentElement.classList.toggle('full', on); document.body.classList.toggle('full', on);
  deck.querySelectorAll('.panel[data-id]').forEach(p => p.classList.toggle('fp', on && p.dataset.id === String(id)));
  if (on) { window.scrollTo(0, 0); return; }
  const p = deck.querySelector('.panel[data-id="' + curId + '"]');
  if (p) { try { p.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
}
$('fBack').addEventListener('click', () => setFull(null));

/* ============ Csatolmányok ============ */
function readB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Nem sikerült beolvasni: ' + file.name));
    r.readAsDataURL(file);
  });
}
async function processImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Nem megnyitható kép: ' + file.name)); img.src = url; });
    const max = 1280, w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * sc)); cv.height = Math.max(1, Math.round(h * sc));
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const dataUrl = cv.toDataURL('image/jpeg', 0.85);
    return { kind: 'image', name: file.name || 'kep.jpg', mime: 'image/jpeg', b64: dataUrl.split(',')[1], thumb: dataUrl };
  } finally { URL.revokeObjectURL(url); }
}
async function addFiles(list) {
  for (const f of Array.from(list)) {
    if (attachments.length >= MAX_FILES) { toast('Legfeljebb ' + MAX_FILES + ' fájl csatolható.'); break; }
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    try {
      if (f.type.startsWith('image/')) attachments.push(await processImage(f));
      else if (f.type === 'application/pdf' || ext === 'pdf') {
        if (f.size > MAX_PDF_BYTES) { toast(f.name + ': a PDF túl nagy (max. 10 MB).'); continue; }
        attachments.push({ kind: 'pdf', name: f.name, mime: 'application/pdf', b64: await readB64(f) });
      } else if (f.type.startsWith('text/') || TEXT_EXT.includes(ext)) {

        if (t.length > MAX_TEXT_CHARS) { t = t.slice(0, MAX_TEXT_CHARS) + '\n[…a fájl többi része levágva]'; toast(f.name + ': hosszú fájl, levágtam.'); }
        attachments.push({ kind: 'text', name: f.name, text: t });

}

async function httpError(res) {
  let msg = '';
  try { const j = await res.json(); msg = (j.error && (j.error.message || j.error)) || j.message || JSON.stringify(j).slice(0, 300); }
  catch (e) { msg = res.statusText || ''; }
  if (typeof msg !== 'string') msg = JSON.stringify(msg).slice(0, 300);
  const err = new Error('HTTP ' + res.status + ': ' + msg);
  err.status = res.status;
  return err;
}
const tokStr = (a, b) => (a != null ? a : '?') + ' → ' + (b != null ? b : '?') + ' token';
const byNewest = (a, b) => b.localeCompare(a, 'en', { numeric: true });
function cleanSources(list) {
  const seen = new Set(), out = [];
  (list || []).forEach(x => {
    const url = x && String(x.url || ''); if (!/^https?:\/\//i.test(url) || seen.has(url)) return;
    seen.add(url);
    let title = String((x.title || '')).trim();
    if (!title) { try { title = new URL(url).hostname; } catch (e) { title = url; } }
    out.push({ title: title.slice(0, 140), url });
  });
  return out.slice(0, 12);
}
const searchNote = n => n ? '🌐 ' + n + ' keresés' : '';
const RESP_ONLY = /(^|-)pro($|-)|codex/;   // a -pro és -codex modellek csak a Responses API-n érhetők el

async function callOpenAI(slot, hist, t, sys, signal) {
  const key = S.keys.openai; if (!key) throw new Error('Hiányzik az OpenAI API-kulcs (⚙ Beállítások).');
  if (t.search || RESP_ONLY.test(slot.model)) return openaiResponses(slot, hist, t, sys, signal, key);
  try { return await openaiChat(slot, hist, t, sys, signal, key); }
  catch (e) {
    if (e.status === 404 && /v1\/responses/.test(e.message)) return openaiResponses(slot, hist, t, sys, signal, key);
    throw e;
  }
}
async function openaiChat(slot, hist, t, sys, signal, key) {
  const imgs = t.files.filter(f => f.kind === 'image'), pdfs = t.files.filter(f => f.kind === 'pdf');
  let content = t.fullText;
  if (imgs.length || pdfs.length) {
    content = [{ type: 'text', text: t.fullText }]
      .concat(imgs.map(f => ({ type: 'image_url', image_url: { url: 'data:' + f.mime + ';base64,' + f.b64 } })))
      .concat(pdfs.map(f => ({ type: 'file', file: { filename: f.name, file_data: 'data:application/pdf;base64,' + f.b64 } })));
  }
  const body = { model: slot.model, messages: [{ role: 'system', content: sys }].concat(hist.map(h => ({ role: h.role, content: h.text })), [{ role: 'user', content }]) };
  const res = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(body) });
  if (!res.ok) throw await httpError(res);
  const d = await res.json(), ch = d.choices && d.choices[0], u = d.usage || {};
  return { text: (ch && ch.message && (ch.message.content || ch.message.refusal)) || '', usage: tokStr(u.prompt_tokens, u.completion_tokens), tin: u.prompt_tokens, tout: u.completion_tokens, note: ch && ch.finish_reason === 'length' ? 'a válasz elérte a hosszkorlátot' : '' };
}
async function openaiResponses(slot, hist, t, sys, signal, key) {
  const imgs = t.files.filter(f => f.kind === 'image'), pdfs = t.files.filter(f => f.kind === 'pdf');
  const parts = [{ type: 'input_text', text: t.fullText }]
    .concat(imgs.map(f => ({ type: 'input_image', image_url: 'data:' + f.mime + ';base64,' + f.b64 })))
    .concat(pdfs.map(f => ({ type: 'input_file', filename: f.name, file_data: 'data:application/pdf;base64,' + f.b64 })));
  const body = { model: slot.model, instructions: sys, input: hist.map(h => ({ role: h.role, content: h.text })).concat([{ role: 'user', content: parts }]) };
  if (t.search) body.tools = [{ type: 'web_search' }];
  const res = await fetch('https://api.openai.com/v1/responses', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(body) });
  if (!res.ok) throw await httpError(res);
  const d = await res.json(), u = d.usage || {};
  const text = (d.output || []).filter(o => o.type === 'message').reduce((a, o) => a.concat(o.content || []), [])
    .map(c => c.type === 'output_text' ? c.text : c.type === 'refusal' ? c.refusal : '').join('');
  const notes = [];
  if (d.status === 'incomplete') notes.push('félbeszakadt: ' + ((d.incomplete_details && d.incomplete_details.reason) || 'ismeretlen ok'));
  const out = d.output || [];
  const nSearch = out.filter(o => o.type === 'web_search_call').length;
  if (t.search) notes.push(nSearch ? searchNote(nSearch) : 'nem keresett a weben');
  const sources = cleanSources(out.filter(o => o.type === 'message').reduce((a, o) => a.concat(o.content || []), [])
    .reduce((a, c) => a.concat(c.annotations || []), []).filter(an => an.type === 'url_citation'));
  return { text, usage: tokStr(u.input_tokens, u.output_tokens), tin: u.input_tokens, tout: u.output_tokens, note: notes.join(' · '), sources };
}

async function callAnthropic(slot, hist, t, sys, signal) {
  const key = S.keys.anthropic; if (!key) throw new Error('Hiányzik az Anthropic (Claude) API-kulcs (⚙ Beállítások).');
  const imgs = t.files.filter(f => f.kind === 'image'), pdfs = t.files.filter(f => f.kind === 'pdf');
  const content = imgs.map(f => ({ type: 'image', source: { type: 'base64', media_type: f.mime, data: f.b64 } }))
    .concat(pdfs.map(f => ({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: f.b64 } })))
    .concat([{ type: 'text', text: t.fullText }]);
  let msgs = hist.map(h => ({ role: h.role, content: h.text })).concat([{ role: 'user', content }]);
  const body = { model: slot.model, max_tokens: Math.max(S.maxTokens || 4096, EFF_MIN_TOKENS[S.effort] || 0), system: sys, messages: msgs };
  if (S.effort && S.effort !== 'auto') body.output_config = { effort: S.effort };
  if (t.search) body.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }];
  let text = '', tin = 0, tout = 0, nSearch = 0, last = null, found = [];
  for (let round = 0; round < 4; round++) {     // pause_turn: a hosszú keresési kört folytatni kell
    body.messages = msgs;
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify(body) });
    if (!res.ok) throw await httpError(res);
    const d = await res.json(), u = d.usage || {}, blocks = d.content || [];
    last = d; tin += u.input_tokens || 0; tout += u.output_tokens || 0;
    nSearch += (u.server_tool_use && u.server_tool_use.web_search_requests) || 0;
    text += blocks.filter(p => p.type === 'text').map(p => p.text).join('');
    blocks.forEach(p => {
      if (p.type === 'web_search_tool_result' && Array.isArray(p.content)) found = found.concat(p.content.filter(r => r.type === 'web_search_result'));
      if (p.type === 'text' && Array.isArray(p.citations)) found = found.concat(p.citations.filter(c => c.url));
    });
    if (d.stop_reason === 'pause_turn') { msgs = msgs.concat([{ role: 'assistant', content: blocks }]); continue; }
    break;
  }
  const notes = [];
  if (last.stop_reason === 'max_tokens') notes.push('a válasz elérte a max. hosszt (⚙-ben emelhető)');
  if (last.stop_reason === 'pause_turn') notes.push('a keresés félbeszakadt, a válasz hiányos lehet');
  if (S.effort && S.effort !== 'auto') notes.push('effort: ' + S.effort);
  if (t.search) notes.push(nSearch ? searchNote(nSearch) : 'nem keresett a weben');
  return { text, usage: tokStr(tin, tout), tin, tout, fee: nSearch * 0.01, note: notes.join(' · '), sources: cleanSources(found) };
}

  if (ch && ch.finish_reason === 'length') notes.push('a válasz elérte a hosszkorlátot');
  if (pdfs.length) notes.push('a PDF-et a Grok-nak nem küldtem el');
  return { text, usage: tokStr(u.prompt_tokens, tout), tin: u.prompt_tokens, tout, cost: grokCost(u), note: notes.join(' · ') };
}
async function grokResponses(slot, hist, t, sys, signal, key) {
  const imgs = t.files.filter(f => f.kind === 'image'), pdfs = t.files.filter(f => f.kind === 'pdf');
  const parts = [{ type: 'input_text', text: t.fullText }].concat(imgs.map(f => ({ type: 'input_image', image_url: 'data:' + f.mime + ';base64,' + f.b64 })));
  const body = {
    model: slot.model, instructions: sys,
    input: hist.map(h => ({ role: h.role, content: h.text })).concat([{ role: 'user', content: parts }]),
    tools: [{ type: 'web_search' }],
    store: false,
    max_output_tokens: Math.max(S.maxTokens || 4096, 8192)
  };
  let res;
  try { res = await fetch('https://api.x.ai/v1/responses', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(body) }); }
  catch (e) { if (isNetBlock(e)) throw new Error(GROK_NET_ERR); throw e; }
  if (!res.ok) throw await httpError(res);
  const d = await res.json(), u = d.usage || {}, out = d.output || [];
  const msgs = out.filter(o => o.type === 'message').reduce((a, o) => a.concat(o.content || []), []);
  const text = msgs.map(c => c.type === 'output_text' ? c.text : c.type === 'refusal' ? c.refusal : '').join('');
  const notes = [];
  if (d.status === 'incomplete') notes.push('félbeszakadt: ' + ((d.incomplete_details && d.incomplete_details.reason) || 'ismeretlen ok'));
  const nSearch = out.filter(o => o.type === 'web_search_call' || (/_call$/.test(o.type || '') && /search/.test((o.type || '') + (o.name || '')))).length;
  notes.push(nSearch ? searchNote(nSearch) : 'nem keresett a weben');
  if (pdfs.length) notes.push('a PDF-et a Grok-nak nem küldtem el');
  const cites = msgs.reduce((a, c) => a.concat(c.annotations || []), []).filter(an => an.type === 'url_citation')
    .map(an => ({ url: an.url, title: /^\d+$/.test(String(an.title || '').trim()) ? '' : an.title }));   // az xAI a címek helyén csak sorszámot ad: ilyenkor a webhely neve látszik
  const tout = Math.max(u.output_tokens || 0, (u.total_tokens || 0) - (u.input_tokens || 0));
  return { text, usage: tokStr(u.input_tokens, tout), tin: u.input_tokens, tout, cost: grokCost(u), note: notes.join(' · '), sources: cleanSources(cites) };
}

/* A Perplexity OpenAI-féle felületet ad, és minden modellje magától keres a weben: a forrásokat a válasz
   search_results / citations mezőjéből vesszük. Kép és PDF küldését nem támogatja, ezért azt kihagyjuk. */
async function callPerplexity(slot, hist, t, sys, signal) {
  const key = S.keys.perplexity; if (!key) throw new Error('Hiányzik a Perplexity API-kulcs (⚙ Beállítások).');
  const skipped = t.files.filter(f => f.kind !== 'text');
  const body = { model: slot.model, messages: [{ role: 'system', content: sys }].concat(hist.map(h => ({ role: h.role, content: h.text })), [{ role: 'user', content: t.fullText }]) };
  const res = await fetch('https://api.perplexity.ai/chat/completions', { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(body) });
  if (!res.ok) throw await httpError(res);
  const d = await res.json(), ch = d.choices && d.choices[0], u = d.usage || {};
  let text = (ch && ch.message && (ch.message.content || ch.message.refusal)) || '';
  if (Array.isArray(text)) text = text.map(x => (x && x.text) || '').join('');
  text = text.replace(/<think>[\s\S]*?<\/think>\s*/gi, '');   // a gondolkodó (reasoning) modellek belső gondolatmenete nem kell
  const list = Array.isArray(d.search_results) ? d.search_results
             : (d.citations || []).map(c => (typeof c === 'string' ? { url: c } : c));
  const notes = [];
  if (skipped.length) notes.push('a csatolt ' + (skipped.length > 1 ? 'fájlokat' : 'fájlt') + ' a Perplexitynek nem küldtem el');
  if (ch && ch.finish_reason === 'length') notes.push('a válasz elérte a hosszkorlátot');
  notes.push('a keresés kérésenkénti díja a becslésben nincs benne');
  return { text, usage: tokStr(u.prompt_tokens, u.completion_tokens), tin: u.prompt_tokens, tout: u.completion_tokens, note: notes.join(' · '), sources: cleanSources(list) };
}

function friendlyError(e) {
  if (e && e.name === 'AbortError') return 'Megszakítva.';
  if (e instanceof TypeError || (e && e.name === 'TypeError')) {
    const m = String(e.message || '');
    if (/ISO-8859-1|non ISO|Invalid character|invalid header|Headers/i.test(m)) return 'Az API-kulcsban érvénytelen (láthatatlan) karakter van. Másold be újra a kulcsot. (' + m + ')';
    return 'Hálózati hiba: nincs internet, vagy a böngésző / reklámszűrő / privát DNS letiltotta a kérést. (' + (m || 'TypeError') + ')';
  }
  return (e && e.message) || String(e);
}

/* ============ A beszélgetés megőrzése és automatikus mentése (v1.14.0) ============
   A telefon a háttérben leállíthatja az appot: olyankor a WebView újraindul, és a memóriában tartott beszélgetés
   elveszne. Ezért minden kör után (és háttérbe kerüléskor) a beszélgetés a helyi tárolóba is bekerül, induláskor
   pedig visszatöltődik. Emellett minden befejezett kör a Letöltések/AI-Arena mappa havi gyűjtőfájljának
   végére íródik. */
const CHAT_KEY = 'miarena.chat.v1';
const CHAT_MAX = 1500000;                                                    // a helyi tárolóba mentett beszélgetés legnagyobb mérete
const KEEP = v => v.role === 'user' || v.role === 'ai' || v.role === 'err';   // a "vár" és a folyamatjelző nem mentődik
let convStarted = false;                                                     // írtunk-e már ebbe a beszélgetésbe a gyűjtőfájlban

function chatPack() {
  const o = {};
  Object.keys(convo).forEach(id => {
    const c = convo[id], view = (c.view || []).filter(KEEP);
    if (view.length) o[id] = { view, history: c.history || [] };
  });
  return o;
}
function saveChat() {
  try {
    const o = chatPack(), ids = Object.keys(o);
    if (!ids.length) { localStorage.removeItem(CHAT_KEY); return; }
    const pack = () => JSON.stringify({ v: 1, at: Date.now(), started: convStarted, skip: Array.from(skip), convo: o });
    let str = pack();
    while (str.length > CHAT_MAX) {          // ha nem fér el, a legrégebbi körök kimaradnak a mentésből
      let big = ids[0];
      ids.forEach(id => { if (o[id].view.length > o[big].view.length) big = id; });
      if (o[big].view.length <= 2) break;
      o[big] = { view: o[big].view.slice(2), history: o[big].history.slice(2) };
      str = pack();
    }
    localStorage.setItem(CHAT_KEY, str);
  } catch (e) {}
}
function clearChat() { convStarted = false; try { localStorage.removeItem(CHAT_KEY); } catch (e) {} }
function restoreChat() {
  try {
    const raw = JSON.parse(localStorage.getItem(CHAT_KEY) || 'null');
    if (!raw || !raw.convo) return false;
    let n = 0;
    Object.keys(raw.convo).forEach(id => {
      const c = raw.convo[id];
      if (!c || !Array.isArray(c.view)) return;
      convo[id] = { view: c.view.filter(KEEP), history: Array.isArray(c.history) ? c.history : [] };
      n += convo[id].view.length;
    });
    (raw.skip || []).forEach(x => skip.add(+x));
    convStarted = raw.started === true;
    return n > 0;
  } catch (e) { return false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveChat(); });
window.addEventListener('pagehide', saveChat);

const two = n => String(n).padStart(2, '0');
function stampNow() { const n = new Date(); return n.getFullYear() + '-' + two(n.getMonth() + 1) + '-' + two(n.getDate()) + ' ' + two(n.getHours()) + ':' + two(n.getMinutes()) + ':' + two(n.getSeconds()); }
function autoFileName() { const n = new Date(); return 'Auto_Beszelgetesek_' + n.getFullYear() + '-' + two(n.getMonth() + 1) + '.txt'; }
const lastAnswer = id => [...getConvo(id).view].reverse().find(v => v.role === 'ai' || v.role === 'err');
function roundText(turn, act, hadSum) {
  let out = '';
  if (!convStarted) out += '\n' + '#'.repeat(70) + '\nÚJ BESZÉLGETÉS · ' + stampNow() + '\n' + '#'.repeat(70) + '\n';
  out += '\n' + '='.repeat(70) + '\nDÁTUM: ' + stampNow() + ' · ' + MODE_ICON[S.mode] + ' ' + S.mode + ' · ' + TIERS[S.tier].icon + ' ' + TIERS[S.tier].label +
         (turn.search ? ' · 🌐 webes keresés' : '') + (S.teacher ? ' · 👩‍🏫 tanár mód' : '') + '\n' + '='.repeat(70) + '\n\nKÉRDÉS:\n' + turn.prompt + '\n';
  if (turn.names.length) out += '[Csatolva: ' + turn.names.join(', ') + ']\n';
  act.forEach(s => {
    const v = lastAnswer(s.id); if (!v) return;
    out += '\n--- ' + PROVIDERS[s.provider].label + (v.model ? ' (' + v.model + ')' : '') + ' ---\n' + (v.role === 'err' ? 'HIBA: ' : '') + v.text + '\n';
    if (v.sources && v.sources.length) out += 'FORRÁSOK:\n' + v.sources.map(z => '- ' + z.title + ': ' + z.url).join('\n') + '\n';
  });
  if (hadSum) {
    const v = lastAnswer('sum');
    if (v) out += '\n--- ÖSSZEFOGLALÓ' + (v.model ? ' (' + v.model + ')' : '') + ' ---\n' + (v.role === 'err' ? 'HIBA: ' : '') + v.text + '\n';
  }
  return out;
}
async function autoSave(turn, act, hadSum) {
  const N = window.ArenaNative;
  if (!N || !N.appendText) return;        // böngészőben nincs fájlmentés, ott csak a helyi tárolós megőrzés véd
  try {
    await N.appendText({ name: autoFileName(), text: roundText(turn, act, hadSum) });

  } catch (e) { toast('Az automatikus mentés nem sikerült: ' + ((e && e.message) || e)); }
}

/* ============ Küldés ============ */
async function runSlot(slot, turn) {
  const c = getConvo(slot.id);
  const eff = Object.assign({}, slot, { model: modelOf(slot) });
  const sys = (MODES[S.mode] || MODES['Gyors']) + (S.teacher ? '\n\n' + TEACH_SYS : '') + (S.about && S.about.trim() ? '\n\nTudnivalók a felhasználóról (vedd figyelembe a válaszadáskor): ' + S.about.trim() : '') + (turn.search ? SEARCH_HINT : '');   // a küldéskor érvényes modell
  c.view.push({ role: 'user', text: turn.prompt, files: turn.names });
  c.view.push({ role: 'wait' });
  paintBody(slot.id);
  const ctrl = new AbortController(); controllers.push(ctrl);
  const t0 = performance.now();
  let res = { ok: false };
  try {
    const r = await PROVIDERS[slot.provider].call(eff, c.history, turn, sys, ctrl.signal);
    c.view = c.view.filter(v => v.role !== 'wait');
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    c.view.push({ role: 'ai', model: eff.model, sources: r.sources || [], text: r.text || '(üres válasz)', meta: eff.model + ' · ' + r.usage + ' · ' + sec + ' mp · ' + track(slot.provider, eff.model, r) + (r.note ? ' · ' + r.note : '') });
    c.history.push({ role: 'user', text: turn.prompt + turn.note }, { role: 'assistant', text: r.text });
    res = { ok: true, label: PROVIDERS[slot.provider].label, model: eff.model, text: r.text || '' };
  } catch (e) {
    c.view = c.view.filter(v => v.role !== 'wait');
    res.why = friendlyError(e);
    c.view.push({ role: 'err', text: '[' + eff.model + '] ' + res.why });
  }
  if (turn.prog) {
    const it = turn.prog.items.find(x => x.id === slot.id);
    if (it) { it.state = res.ok ? 'ok' : 'err'; it.why = res.why || ''; it.sec = ((performance.now() - t0) / 1000).toFixed(1); }
    paintBody('sum');
  }
  paintBody(slot.id);
  return res;
}
async function runSummary(turn, oks) {
  const c = getConvo('sum'), P = S.sumAI, eff = { provider: P.provider, model: P.model }, pg = turn.prog;
  if (pg) pg.sum = 'wait'; else c.view.push({ role: 'user', text: turn.prompt, files: turn.names });
  paintBody('sum');
  const fullText = 'Kérdés:\n' + turn.prompt + '\n\n' + oks.map(a => '=== ' + a.label + ' (' + a.model + ') válasza ===\n' + a.text.slice(0, 12000)).join('\n\n');
  const sturn = { prompt: turn.prompt, fullText, files: [], names: [], note: '', search: false };
  const ctrl = new AbortController(); controllers.push(ctrl);
  const t0 = performance.now();
  try {
    const r = await PROVIDERS[P.provider].call(eff, [], sturn, SUM_SYS, ctrl.signal);
    if (pg) pg.sum = 'done';
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    c.view.push({ role: 'ai', model: P.model, sources: [], text: r.text || '(üres válasz)', meta: P.model + ' · ' + r.usage + ' · ' + sec + ' mp · ' + track(P.provider, P.model, r) + (r.note ? ' · ' + r.note : '') });
  } catch (e) {
    if (pg) pg.sum = 'err';
    c.view.push({ role: 'err', text: '[' + P.model + '] ' + friendlyError(e) });
  }
  paintBody('sum');
}
function setSendBtn() {
  const b = $('bSend');
  b.textContent = busy ? 'Leállít' : 'Küldés';
  b.classList.toggle('stop', busy);
}
async function send() {
  if (busy) { controllers.forEach(c => c.abort()); return; }
  const text = $('inp').value.trim();
  if (!text && !attachments.length) return;
  const act = S.slots.filter(s => s.active && !skip.has(s.id));
  if (!act.length) { toast(S.slots.some(s => s.active) ? 'Minden AI ki van pipálva, jelölj ki legalább egyet.' : 'Nincs aktív ablak (⚙ Beállítások).'); return; }
  if (asking) return;
  if (lockActive() && S.tier === 'strong') {
    rollDay();
    if (usedUp()) {
      asking = true;
      const ok = await askPin('Elfogyott a mai ' + S.lock.limit + ' erős kérdés. A PIN-nel még ' + S.lock.limit + ' kérdést oldasz fel.');
      asking = false;
      if (!ok) return;
      S.usage.unlocks++;
    }
    S.usage.n++; saveSettings();
  }
  const files = attachments.slice();
  const prompt = text || 'Mit tartalmaz a csatolt fájl? Röviden foglald össze.';
  const fullText = prompt + files.filter(f => f.kind === 'text').map(f => '\n\n--- ' + f.name + ' ---\n' + f.text).join('');
  const names = files.map(f => f.name);
  const turn = { prompt, fullText, files, names, search: !!S.search, note: names.length ? '\n[Csatolva: ' + names.join(', ') + ']' : '' };
  if (micWant) micStop(); spkStop();
  $('inp').value = ''; autoGrow(); attachments = []; renderAtts();
  if (S.sum && act.length >= 2) {
    turn.prog = { role: 'prog', items: act.map(s => ({ id: s.id, label: PROVIDERS[s.provider].label, state: 'wait', sec: '' })), sum: 'idle' };
    getConvo('sum').view.push({ role: 'user', text: prompt, files: names }, turn.prog);
    paintBody('sum');
  }
  busy = true; controllers = []; setSendBtn();
  const results = await Promise.allSettled(act.map(s => runSlot(s, turn)));
  let hadSum = false;
  if (S.sum) {
    const oks = results.map(r => r.value).filter(v => v && v.ok && v.text);
    if (oks.length >= 2) { await runSummary(turn, oks); hadSum = true; }
    else {
      if (turn.prog) { turn.prog.sum = 'skip'; paintBody('sum'); }
      if (act.length >= 2) toast('Összefoglaló kihagyva: legalább két sikeres válasz kell.');
    }
  }
  busy = false; setSendBtn();
  saveChat();                              // a beszélgetés a háttérbe kerülés után is megmarad
  await autoSave(turn, act, hadSum);       // a kör a havi gyűjtőfájl végére kerül
}

let rec = null, micWant = false, micBase = '', micFinal = '';
function micUI(on) { $('bMic').classList.toggle('on', on); $('bMic').textContent = on ? '⏹' : '🎤'; }
function micStop() { micWant = false; if (rec) { try { rec.stop(); } catch (e) {} } micUI(false); }
function micStart() {
  if (!SR) { toast('Ez a böngésző nem tud beépítetten diktálni. Használd a billentyűzet 🎤 gombját.'); return; }
  spkStop();
  const inp = $('inp');
  micWant = true; micUI(true);
  const run = () => {
    micBase = inp.value && !/\s$/.test(inp.value) ? inp.value + ' ' : inp.value; micFinal = '';
    rec = new SR(); rec.lang = SPEECH_LANG; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = ev => {
      let fin = '', tmp = '';
      for (let i = 0; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) fin += r[0].transcript; else tmp += r[0].transcript; }
      inp.value = micBase + fin + tmp; autoGrow();
    };
    rec.onerror = ev => {
      const e = ev && ev.error;
      if (e === 'no-speech' || e === 'aborted') return;
      micWant = false; micUI(false);
      if (e === 'not-allowed') toast('A mikrofon nincs engedélyezve ennél az oldalnál (a böngésző lakat ikonjánál engedélyezhető).');
      else if (e === 'service-not-allowed' || e === 'network' || e === 'language-not-supported') toast('Ebben a böngészőben nem működik a beépített diktálás (Chrome-ban igen). Használd a billentyűzet 🎤 gombját.');
      else toast('Diktálási hiba: ' + (e || 'ismeretlen'));
    };
    rec.onend = () => {
      inp.value = inp.value.replace(/\s+$/, '') + (inp.value.trim() ? ' ' : ''); autoGrow();
      if (micWant) { try { run(); } catch (e) { micStop(); } } else micUI(false);
    };
    rec.start();
  };
  try { run(); } catch (e) { micStop(); toast('A diktálás nem indult el.'); }
}
$('bMic').addEventListener('click', () => { if (micWant) micStop(); else micStart(); });

const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let spkOn = false;
function spkUI(on) { spkOn = on; $('bSpk').classList.toggle('on', on); $('bSpk').textContent = on ? '⏹' : '🔊'; }
function spkStop() { if (hasTTS) { try { speechSynthesis.cancel(); } catch (e) {} } spkUI(false); }
function speakable(md) {
  return String(md || '')
    .replace(/```[\s\S]*?```/g, ' (kódrészlet) ')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/https?:\/\/\S+/g, ' ')
    .replace(/^\s*\|?[\s:|-]{3,}\|?\s*$/gm, ' ')
    .replace(/^\s*\|/gm, '').replace(/\|\s*$/gm, '')
    .replace(/\|/g, ', ')
    .replace(/^\s{0,3}#{1,6}\s*/gm, '')
    .replace(/^\s*[-*•]\s+/gm, '')
    .replace(/[*_~>#]+/g, '')
    .replace(/[ \t]+/g, ' ').replace(/\n{2,}/g, '\n').trim();
}
function speechChunks(t, max = 180) {
  const out = []; let cur = '';
  for (const part of t.split(/(?<=[.!?…:;\n])\s*/)) {
    if (!part) continue;
    if ((cur + ' ' + part).length > max && cur) { out.push(cur); cur = part; } else cur = cur ? cur + ' ' + part : part;
    while (cur.length > max * 1.6) { const k = cur.lastIndexOf(' ', max); const cut = k > 20 ? k : max; out.push(cur.slice(0, cut)); cur = cur.slice(cut).trim(); }
  }
  if (cur) out.push(cur);
  return out;
}
function spkStart() {
  if (!hasTTS) { toast('Ez a böngésző nem tud felolvasni.'); return; }
  const id = curPanelId(); if (id == null) return;
  const last = [...getConvo(id).view].reverse().find(v => v.role === 'ai');
  if (!last || !last.text) { toast('Ebben az ablakban még nincs válasz.'); return; }
  const chunks = speechChunks(speakable(last.text)); if (!chunks.length) return;
  if (micWant) micStop();
  try { speechSynthesis.cancel(); } catch (e) {}
  const voices = (speechSynthesis.getVoices && speechSynthesis.getVoices()) || [];
  const hu = voices.find(v => /^hu/i.test(v.lang));
  if (voices.length && !hu) toast('Nincs magyar hang a telefonon, ezért a felolvasás idegenül szólhat (Android: Beállítások › Szövegfelolvasó).');
  spkUI(true);
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c); u.lang = SPEECH_LANG; if (hu) u.voice = hu; u.rate = 1;
    if (i === chunks.length - 1) { u.onend = () => spkUI(false); u.onerror = () => spkUI(false); }
    else u.onerror = () => spkUI(false);
    speechSynthesis.speak(u);
  });
}

dlg.addEventListener('click', async e => {

  S.tier = S.tier === 'strong' ? 'cheap' : 'strong';
  saveSettings(); updateLabels();
  toast(TIERS[S.tier].icon + ' ' + TIERS[S.tier].label + ': ' + S.slots.filter(x => x.active).map(x => modelOf(x)).join(' · ') + lockInfo());
});
const chatBack = restoreChat();   // a háttérben leállított app beszélgetése
applyTheme();
renderDeck();
updateTierBtn();
updateWebBtn();
updateModeBtn();
updateTeachBtn();
updateEffBtn();
if (chatBack) setTimeout(() => toast('🔄 A korábbi beszélgetés visszatöltve.'), 400);
if (!Object.keys(PROVIDERS).some(k => S.keys[k])) setTimeout(() => toast('Első lépés: ⚙ → API-kulcsok megadása'), 600);
})();
</script>
</body>
</html>
